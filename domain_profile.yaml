domain: agentic_systems_research
display_name: THALIA Auto-Harness Research
required_packages:
  - numpy
  - matplotlib
  - pytest
preferred_outputs:
  - pdf
  - html
validation_gates:
  - experiment_method_design
  - artifact_manifest
  - evidence_grounding
  - render_validation
figure_types:
  # Kept in src/figures/manifest.py::FIGURE_MANIFEST order for profile-required figures.
  - retriever_comparison
  - rrf_sensitivity
  - compiler_convergence
  - consolidation_curve
  - category_breakdown
  - evidence_funnel
  - noise_scaling
  - mmr_tradeoff
  - method_ablation
  - orchestration_value
  - scaling_ci
  - sample_size_precision
  - statistical_audit
  - category_components
  - pipeline_flow
  - gepa_trajectory
  - thalia_cover
  - thalia_overview
  - foundations_map
  - quality_protocol
  - memory_lifecycle
  - gepa_evolution_loop
  - backend_comparison
  - paraphrase_retrieval
  - injection_resistance
  - integrity_advantage_audit
  - longmemeval
  - bottleneck
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs, the four foundational papers, and the template/ substrate. Mark commissioned-brief citations as provided; do not assert independent verification."
review_gates:
  - experiment_method_design
  - evidence_grounding
  - render_validation
  - model_quality_review
  - production_readiness_review
artifact_expectations:
  # Committed input to the source-bound integrity screen (not a disposable output).
  - data/integrity_advantage.json
  - output/data/eval_results.json
  - output/data/compile_result.json
  - output/data/seed_sensitivity.json
  - output/data/compiler_generalization.json
  - output/data/demo_result.json
  - output/data/pipeline_result.json
  - output/data/manuscript_variables.json
  - output/figures/retriever_comparison.png
  - output/figures/rrf_sensitivity.png
