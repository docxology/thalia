  - output/reports/evaluation_ledger.jsonl
  - output/reports/paper_audit.json
  - output/reports/formalism_traceability.json
benchmark_rubric:
  name: thalia-harness-readiness
  dimensions:
    - name: deterministic_reproducibility
      weight: 2.0
    - name: evidence_grounding
      weight: 2.0
    - name: test_coverage
      weight: 1.0
    - name: artifact_manifest
      weight: 1.0
    - name: scope_honesty
      weight: 2.0
llm_prompt_guidance: "Use generated evaluation artifacts and manuscript variables as the evidence source; never invent numeric results. Preserve the stated scope boundaries (extractive-LM accuracy ceiling; hashing-embedding semantic surrogate)."
