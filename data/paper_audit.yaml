      zero_weight_noop: tests/test_retriever.py::TestRetrieverForward.test_recency_zero_is_noop
      recalled_window_exemption: src/stages/retriever.py::Retriever._apply_recency
      deterministic_ties: src/stages/retriever.py::Retriever._apply_recency
    limitation: source position is a structural recency proxy, not elapsed time or a causal temporal effect
  - id: evidence_budget
    equation: eq:evidence-budget
