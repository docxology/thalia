schema_version: 3
scope: code_to_paper_publication_red_team
evidence_boundary: finite_synthetic_and_recorded_local_external_evidence
interpretation_policy:
  synthetic: finite generated task family; not a population estimate
  neural: model-dependent and not byte-identical across hosts
  benchmark: external input identified by size and SHA-256
  grounding: citation-support proxy unless explicitly labelled session reachability
  token_f1: set-based token overlap; repeated token multiplicity is intentionally ignored
  intervals: descriptive percentile or cluster-resampling diagnostics; finite seed-cluster counts do not establish ordinary population coverage claims
  multiplicity: Holm step-down adjusted values are p_Holm, not FDR q-values
  paired_continuous_tests: sign-flip randomization diagnostics require paired-difference exchangeability; exhaustive enumeration is limited to small paired samples
  paired_binary_tests: exact two-sided McNemar conditional on discordant pairs
notation:
  supplemental_section: manuscript/12_supplemental_notation.md
  symbols:
    - {symbol: 'T(x)', meaning: ordered lowercase alphanumeric token sequence}
    - {symbol: 'U(x)', meaning: set of distinct tokens in T(x)}
    - {symbol: '\\mathcal H', meaning: raw session transcript supplied to the Inspector}
    - {symbol: '\\mathcal M', meaning: frozen memory snapshot for one invocation}
    - {symbol: '\\theta', meaning: immutable HarnessConfig for one invocation}
    - {symbol: 'W_I', meaning: Inspector evidence-window sequence}
    - {symbol: '\\mu_I', meaning: Inspector metadata}
    - {symbol: 'W_R', meaning: Retriever ranked evidence sequence}
    - {symbol: '\\delta_R', meaning: Retriever delivery decision}
    - {symbol: '\\hat y', meaning: generated answer}
    - {symbol: '\\tau_N', meaning: Reasoner routing and evidence-use trace}
    - {symbol: 'e', meaning: episodic append result}
    - {symbol: '\\Delta_{\\mathcal M}', meaning: optional derived memory delta}
    - {symbol: 'I_\\theta', meaning: Inspector stage function}
    - {symbol: 'R_\\theta', meaning: Retriever stage function}
    - {symbol: 'N_\\theta', meaning: Reasoner stage function}
    - {symbol: 'G_\\theta', meaning: Memory Gate stage function}
    - {symbol: q, meaning: current query text whose T(q) tokens drive retrieval}
    - {symbol: c_q, meaning: task category classified from query q}
    - {symbol: t, meaning: turn identifier used by the episodic store}
    - {symbol: s, meaning: session-ending indicator supplied to the Memory Gate}
    - {symbol: b_N, meaning: Reasoner gate payload containing consolidation and explicit-request flags}
    - {symbol: r_N, meaning: Reasoner consolidation-request flag}
    - {symbol: x_N, meaning: explicit memory-request indicator derived from the query}
    - {symbol: '\\Sigma_G', meaning: Memory Gate state containing episodic and derived-memory state}
    - {symbol: '\\Theta', meaning: Compiler candidate configuration surface}
    - {symbol: '\\mathcal D', meaning: finite evaluation set supplied to a Compiler run}
    - {symbol: '\\hat\\theta', meaning: first maximum-scoring configuration under stable candidate order}
    - {symbol: '\\mathcal T_C', meaning: complete Compiler candidate-and-trace ledger}
    - {symbol: '\\bar M', meaning: mean composite score for a configuration on the evaluation set}
    - {symbol: '\\prec_\\Theta', meaning: stable candidate order used to resolve equal Compiler scores}
    - {symbol: d, meaning: candidate document or window token sequence}
    - {symbol: R, meaning: ranked evidence collection}
    - {symbol: A, meaning: answer token-F1 component}
    - {symbol: H, meaning: expected-source citation indicator}
    - {symbol: 'r_l(c)', meaning: zero-based candidate rank in lane l}
    - {symbol: 'B_b', meaning: Inspector partition block}
    - {symbol: B, meaning: evidence token budget}
    - {symbol: 'Q_I', meaning: Inspector query-token set}
    - {symbol: 'S_MMR', meaning: candidates selected by greedy MMR}
    - {symbol: 'C_cite', meaning: cited source-index set}
    - {symbol: 'E_cite', meaning: joined cited excerpts}
    - {symbol: 'G_gold', meaning: expected source-index set}
    - {symbol: 'G_sup', meaning: citation-support proxy}
    - {symbol: 'P_cite', meaning: source-index citation precision}
    - {symbol: 'R_src', meaning: source-index citation recall}
    - {symbol: 'S_eff', meaning: structural-efficiency scale}
    - {symbol: 'E_eff', meaning: structural-efficiency score}
    - {symbol: M, meaning: per-example composite score}
    - {symbol: 'Y_q', meaning: outcome for analysis unit q}
    - {symbol: 'Delta_q', meaning: paired left-minus-right outcome difference}
    - {symbol: 'p_Holm', meaning: Holm-adjusted paired-test p-value}
    - {symbol: 'n_obs', meaning: observed denominator row count}
    - {symbol: 'n_cluster', meaning: cluster count}
  crosswalk:
    - {formalism: typed_stage_composition, symbols: ['I_\\theta', 'R_\\theta', 'N_\\theta', 'G_\\theta', 'b_N', 'r_N', 'x_N', '\\Sigma_G']}
    - {formalism: compiler_selection, symbols: ['\\Theta', '\\mathcal D', '\\hat\\theta', '\\mathcal T_C', '\\bar M', '\\prec_\\Theta']}
    - {formalism: shared_tokenizer, symbols: ['T(x)', 'U(x)']}
    - {formalism: token_f1_set, symbols: ['T(x)', 'U(x)']}
    - {formalism: bm25, symbols: [q, d]}
    - {formalism: hashing_cosine, symbols: [d]}
    - {formalism: weighted_rrf, symbols: ['r_l(c)']}
    - {formalism: mmr, symbols: [S_MMR]}
    - {formalism: inspector_relevance, symbols: [Q_I]}
    - {formalism: inspector_partition, symbols: [B_b]}
    - {formalism: prf_expansion, symbols: [q, d]}
    - {formalism: recency_bonus, symbols: [d]}
    - {formalism: evidence_budget, symbols: [B]}
    - {formalism: grounding_support, symbols: [C_cite, E_cite, G_gold, G_sup]}
    - {formalism: citation_precision, symbols: [C_cite, G_gold, P_cite]}
    - {formalism: source_recall, symbols: [C_cite, G_gold, R_src]}
    - {formalism: evidence_efficiency, symbols: [S_eff, E_eff]}
    - {formalism: composite_metric, symbols: [M, G_sup, E_eff]}
    - {formalism: stratified_cluster_resampling, symbols: [Y_q, n_obs, n_cluster]}
    - {formalism: research_dataset, symbols: [Y_q, n_obs]}
    - {formalism: evaluation_ledger, symbols: [n_obs]}
    - {formalism: adjudicated_quality, symbols: [Y_q, n_obs]}
    - {formalism: quality_primary_estimand, symbols: [Y_q, n_obs]}
    - {formalism: operational_readiness, symbols: [Y_q, n_obs]}
statistical_contracts:
  - id: percentile_bootstrap
    implementation: src/evaluation/statistics.py::bootstrap_mean
    tests: tests/test_statistics.py::TestBootstrapMean.test_summary_has_provenance_and_bounds
    method: descriptive percentile bootstrap interval
    estimand: finite-set arithmetic mean of continuous observations
    interval_interpretation: descriptive_percentile_bootstrap_interval
    assumption: iid resampling is a finite-data descriptive construction, not a population guarantee
  - id: stratified_cluster_bootstrap
    implementation: [src/evaluation/statistics.py::stratified_bootstrap_mean, src/evaluation/statistics.py::clustered_bootstrap_mean]
    tests: tests/test_statistics.py::TestBootstrapMean.test_stratified_and_clustered_provenance
    method: fixed-stratum or whole-cluster resampling interval
    estimand: declared finite-set mean with observed stratum or cluster weighting
    interval_interpretation: descriptive_stratified_or_cluster_resampling_interval
    assumption: the resampling unit and weighting must match the declared estimand
  - id: wilson_score
    implementation: src/evaluation/statistics.py::wilson_interval
    tests: tests/test_statistics.py::TestRatesAndPairedComparisons.test_wilson_interval_matches_independent_golden_value
    method: Wilson score interval for a binary rate
    estimand: observed binary success rate
    interval_interpretation: binomial_score_interval
    assumption: binary trials with a common success probability for the score construction
  - id: exact_mcnemar
    implementation: src/evaluation/statistics.py::exact_paired_binary
    tests: tests/test_statistics.py::TestRatesAndPairedComparisons.test_mcnemar_golden_two_sided_tail
    method: exact two-sided conditional McNemar binomial test
    estimand: paired binary discordance under equal success probabilities
    interval_interpretation: p_value_only
    assumption: paired binary outcomes and conditional discordant-pair null
  - id: paired_sign_flip
    implementation: src/evaluation/statistics.py::paired_permutation_p_value
    tests: tests/test_statistics.py::TestRatesAndPairedComparisons.test_sign_flip_metadata_distinguishes_exhaustive_and_monte_carlo
    method: exhaustive or seeded Monte Carlo paired sign-flip randomization diagnostic
    estimand: mean paired continuous difference
    interval_interpretation: p_value_only
    assumption: paired differences are sign-exchangeable under the null
  - id: holm_step_down
    implementation: src/evaluation/statistics.py::holm_bonferroni
    tests: tests/test_statistics.py::TestRatesAndPairedComparisons.test_holm_golden_step_down_values
    method: Holm step-down multiplicity adjustment
    estimand: complete named comparison family
    interval_interpretation: adjusted_p_value
    assumption: the declared family is complete before adjustment
formalisms:
  - id: shared_tokenizer
    equation: eq:tokenizer
    implementation: src/module.py::tokenize
    tests: tests/test_module.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: token sequence
    estimand: normalized alphanumeric tokenization
    inputs: [text]
    outputs: [lowercase alphanumeric tokens]
    dependencies: []
    invariants: [deterministic_tokenization]
    invariant_anchors:
      deterministic_tokenization: tests/test_module.py::TestTokenize.test_lowercases_and_splits
    limitation: punctuation and morphology are not modeled beyond regex token boundaries
  - id: typed_stage_composition
    equation: eq:typed-composition
    implementation: src/pipeline.py::Pipeline
    tests: tests/test_pipeline.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: stage invocation
    estimand: ordered typed handoffs from transcript and query to answer, citations, and memory decision
    inputs: [session_history, query, config, memory_snapshot, task_category, turn_state, memory_gate_state]
    outputs: [inspector_windows, ranked_evidence, answer, citations, episodic_append, memory_delta, updated_memory_gate_state]
    dependencies: [shared_tokenizer]
    invariants: [ordered_stage_handoffs, append_before_consolidation]
    invariant_anchors:
      ordered_stage_handoffs: tests/test_pipeline.py
      append_before_consolidation: tests/test_pipeline.py
    limitation: the composition exposes software state and evidence flow; answer correctness requires a model-quality protocol
  - id: compiler_selection
    equation: eq:compiler-selection
    implementation: src/compiler/mipro.py::MIPROCompiler
    tests: tests/test_mipro.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: candidate configuration
    estimand: first stable-order maximizer of the finite-set mean composite score
    inputs: [candidate_surface, evaluation_set, stable_candidate_order]
    outputs: [selected_configuration, candidate_trace]
    dependencies: [composite_metric, evaluation_ledger]
    invariants: [deterministic_candidate_order, complete_trace, first_maximum_tie_rule]
    invariant_anchors:
      deterministic_candidate_order: tests/test_mipro.py
      complete_trace: tests/test_mipro.py
      first_maximum_tie_rule: tests/test_mipro.py
    limitation: configuration selection on a finite declared evaluation set; generalization requires held-out or external evidence
  - id: token_f1_set
    equation: eq:token-f1
    implementation: src/compiler/metrics.py::token_f1
    tests: tests/test_metrics.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: example
    estimand: set-based lexical answer overlap F1
    inputs: [prediction, gold_answer]
    outputs: [precision, recall, f1]
    dependencies: [shared_tokenizer]
    invariants: [bounded_metric, empty-empty_is_one]
    invariant_anchors:
      bounded_metric: tests/test_metrics.py::TestTokenF1.test_perfect_match_is_one
      empty-empty_is_one: tests/test_metrics.py::TestTokenF1.test_both_empty_is_one
    limitation: token multiplicity, synonymy, entailment, factuality, and semantic correctness are not measured
  - id: bm25
    equation: eq:bm25
    implementation: src/retrieval/lexical.py::BM25Index
    tests: tests/test_lexical.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: query-document score
    estimand: Okapi BM25 score under the shared tokenizer
    inputs: [query, document_corpus, k1, b]
    outputs: [ranked_document_indices, scores]
    dependencies: [shared_tokenizer]
    invariants: [nonnegative_idf, zero_score_exclusion, deterministic_ties]
    invariant_anchors:
      nonnegative_idf: src/invariants.py::check_bm25_idf_nonnegative
      zero_score_exclusion: tests/test_lexical.py::TestBM25TopK.test_zero_score_docs_excluded
      deterministic_ties: tests/test_lexical.py::TestBM25TopK.test_ties_break_on_index
    limitation: query terms are a multiset, OOV terms contribute zero, and no learned semantic representation is used
  - id: hashing_cosine
    equation: eq:hash-cosine
    implementation: [src/retrieval/semantic.py::embed, src/retrieval/semantic.py::cosine]
    tests: tests/test_semantic.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: query-document similarity
    estimand: cosine similarity of signed SHA-1 character-trigram vectors
    inputs: [text, dimension]
    outputs: [unit_vector, cosine_similarity]
    dependencies: []
    invariants: [deterministic_embedding, zero_vector_similarity_zero]
    invariant_anchors:
      deterministic_embedding: tests/test_semantic.py::TestEmbed.test_deterministic
      zero_vector_similarity_zero: tests/test_semantic.py::TestCosine.test_zero_vector_zero
    limitation: a hashing sub-word surrogate; it is not a learned embedding model or a semantic correctness measure
  - id: weighted_rrf
    equation: eq:rrf
    implementation: src/retrieval/fusion.py::rrf_fuse
    tests: tests/test_fusion.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: candidate chunk
    estimand: weighted reciprocal-rank fusion score
    inputs: [lexical_ranked_list, semantic_ranked_list, lane_weights, damping_constant]
    outputs: [fused_ranked_list]
    dependencies: [bm25, hashing_cosine]
    invariants: [zero_based_rank, first_duplicate_occurrence, deterministic_ties]
    invariant_anchors:
      zero_based_rank: tests/test_fusion.py::TestRRFFusion.test_ranks_recorded
      first_duplicate_occurrence: tests/test_fusion.py::TestRRFFusion.test_duplicate_id_in_a_lane_is_deduped_to_first_occurrence
      deterministic_ties: tests/test_fusion.py::TestRRFFusion.test_ties_break_on_id
    limitation: absent lanes contribute nothing, native scores are not calibrated, and only the ordering key is fixed-precision rounded
  - id: mmr
    equation: eq:mmr
    implementation: src/retrieval/mmr.py::mmr_rerank
    tests: tests/test_mmr.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: candidate ordering
    estimand: greedy relevance-diversity selection over fused candidates
    inputs: [fused_scores, window_texts, lambda, k]
    outputs: [selected_order]
    dependencies: [hashing_cosine, weighted_rrf]
    invariants: [lambda_one_relevance_order, deterministic_ties, bounded_selection]
    invariant_anchors:
      lambda_one_relevance_order: tests/test_mmr.py::TestBehaviour.test_lambda_one_preserves_relevance_order
      deterministic_ties: tests/test_mmr.py::TestBehaviour.test_deterministic
      bounded_selection: tests/test_mmr.py::TestBehaviour.test_k_limits_length
    limitation: first selection is seeded by relevance and pairwise similarity uses the hashing surrogate
  - id: inspector_relevance
    equation: eq:inspector-relevance
    implementation: src/stages/inspector.py::_relevance
    tests: tests/test_inspector.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: transcript record
    estimand: fraction of distinct query tokens present in a record
    inputs: [query_token_set, record_text]
    outputs: [relevance in 0..1]
    dependencies: [shared_tokenizer]
    invariants: [bounded_relevance, empty_query_zero]
    invariant_anchors:
      bounded_relevance: src/stages/inspector.py::_relevance
      empty_query_zero: src/stages/inspector.py::_relevance
    limitation: distinct-token overlap is lexical and does not detect paraphrase meaning
  - id: inspector_partition
    equation: eq:inspector-partition
    implementation: src/stages/inspector.py::Inspector._coarse_block_filter
    tests: tests/test_inspector.py
    manuscript_sections: manuscript/04b_harness_formalism_and_added_methods.md
    evidence_tier: project_source
    status: executable_contract
    unit: transcript block
    estimand: summed record relevance used for depth-one coarse filtering
    inputs: [partitioned_records, query_token_set, max_windows, partition_size]
    outputs: [allowed_record_indices]
    dependencies: [inspector_relevance]
    invariants: [consecutive_partition, at_least_one_block]
    invariant_anchors:
      consecutive_partition: tests/test_inspector.py::TestREPLPartition.test_partition_blocks
      at_least_one_block: tests/test_inspector.py::TestInspectorRecursion.test_long_context_triggers_coarse_filter
    limitation: discarded blocks cannot be recovered by later fine ranking; this is a diagnostic bottleneck candidate
  - id: prf_expansion
    equation: eq:prf
