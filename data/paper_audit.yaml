    outputs: [expanded_query]
    dependencies: [bm25, shared_tokenizer]
    invariants: [distinct_feedback_terms, frequency_then_alphabetical_order]
    invariant_anchors:
      distinct_feedback_terms: tests/test_expansion.py::TestExpansion.test_adds_feedback_terms
      frequency_then_alphabetical_order: src/retrieval/expansion.py::expand_query
    limitation: RM3-inspired heuristic; it is not a learned query-expansion model
  - id: recency_bonus
