# THALIA Project Configuration
# Agentic Typed-pipeline with Lexical And Self-improving stages.
# Inherits workspace settings from the repository root pyproject.toml.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thalia"
version = "0.1.0"
description = "Agentic Typed-pipeline with Lexical And Self-improving stages: a DSPy + Hermes auto-harness"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    # TOML reader for provenance/manuscript-variable gates. tomllib is stdlib on
    # Python >= 3.11; tomli is the identical-API backport for 3.10 (the declared
    # minimum). Pure-Python, offline — does not touch the deterministic core.
    "tomli>=2.0 ; python_version < '3.11'",
    # Mandatory as of 2026-07-01 (bridges THALIA signatures to real DSPy/GEPA
    # evolution, see src/compiler/gepa.py::DSPY_AVAILABLE). The deterministic
    # core still never imports it directly — only the gated seams do.
    "dspy-ai>=3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "pytest-httpserver>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Only measure project source; never let test code inflate the metric.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# >=90% on src/ is the enforced project gate (mirrors the template standard).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from the repository root pyproject.toml.
