# THALIA Project Configuration
# Agentic Typed-pipeline with Lexical And Self-improving stages.
# Inherits workspace settings from the repository root pyproject.toml.

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thalia"
version = "0.1.0"
description = "Agentic Typed-pipeline with Lexical And Self-improving stages: a DSPy + Hermes auto-harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
]
keywords = [
    "agentic systems",
    "long-context memory",
    "retrieval-augmented generation",
    "reproducible research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    # TOML reader for provenance/manuscript-variable gates. tomllib is stdlib on
    # Python >= 3.11; tomli is the identical-API backport for 3.10 (the declared
    # minimum). Pure-Python, offline — does not touch the deterministic core.
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "pytest-httpserver>=1.0.0",
    "types-PyYAML>=6.0",
    "mypy>=1.10.0",
    "ruff>=0.14.0",
    "dspy-ai>=3.2.1",
]

neural = [
    "dspy-ai>=3.2.1",
]

[project.urls]
Homepage = "https://github.com/docxology/thalia"
Repository = "https://github.com/docxology/thalia"
Issues = "https://github.com/docxology/thalia/issues"
Changelog = "https://github.com/docxology/thalia/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
# THALIA intentionally exposes the package's ``src.*`` import surface.  The
# explicit package discovery prevents setuptools' src-layout heuristic from
# flattening ``src`` into top-level modules in built wheels.
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Only measure project source; never let test code inflate the metric.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# >=90% on src/ is the enforced project gate (mirrors the template standard).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from the repository root pyproject.toml.

[tool.mypy]
# The deterministic core is typed; DSPy is an explicitly optional runtime extra.
[[tool.mypy.overrides]]
module = ["dspy", "dspy.*", "yaml", "yaml.*"]
ignore_missing_imports = true
