conditions:
  - name: hybrid_default
    role: proposed
    description: "Lexical-first hybrid retrieval with weighted RRF (default config)."
  - name: lexical_only
    role: reference
    description: "Lexical (BM25/grep) lane only — the inline-delivery baseline."
  - name: semantic_only
    role: variant
    description: "Hashing-embedding semantic lane only (deterministic surrogate)."
metrics:
  primary:
    name: composite
    direction: maximize
    components:
      - {name: accuracy, weight: 0.6}
      - {name: grounding, weight: 0.3}
      - {name: efficiency, weight: 0.1}
protocol: "Preserve the six-example deterministic demo as a regression fixture, then run lexical-only, surrogate-semantic-only, and hybrid retrieval over the balanced seeded research dataset at per-category sizes (10, 25, 50, 100) and five fixed seeds. Use paired metrics on identical examples, within-stratum and seed-cluster bootstrap intervals, Wilson binary-rate intervals, exact paired binary tests, a complete Holm comparison family, and explicit ledger/event accounting. Then sweep RRF lane weight and session noise. Preserve the two scope boundaries: accuracy is bounded by the deterministic extractive LM, and the semantic lane is a hashing-embedding surrogate rather than a learned dense retriever. Synthetic results are machinery evidence, not population estimates."
expected_figures:
  - fig:retriever_comparison
  - fig:rrf_sensitivity
  - fig:compiler_convergence
  - fig:consolidation
  - fig:category_breakdown
  - fig:evidence_funnel
  - fig:noise_scaling
  - fig:mmr_tradeoff
  - fig:method_ablation
  - fig:orchestration_value
  - fig:scaling_ci
  - fig:sample_size_precision
  - fig:statistical_audit
  - fig:backend_comparison
  - fig:paraphrase_retrieval
  - fig:injection_resistance
  - fig:longmemeval
  - fig:bottleneck
expected_tables:
  - tbl:headline_results
baselines:
  - lexical_only
ablations:
  - semantic_only
