conditions:
  - name: hybrid_default
    role: proposed
    description: "Lexical-first hybrid retrieval with weighted RRF (default config)."
  - name: lexical_only
    role: reference
    description: "Lexical (BM25/grep) lane only — the inline-delivery baseline."
  - name: semantic_only
    role: variant
    description: "Hashing-embedding semantic lane only (deterministic surrogate)."
metrics:
  primary:
    name: composite
    direction: maximize
    components:
      - {name: accuracy, weight: 0.6}
      - {name: grounding, weight: 0.3}
      - {name: efficiency, weight: 0.1}
protocol: "Run the deterministic LongMemEval-style dataset through AutoHarness under each retrieval condition with identical seeds, evidence budgets, and the deterministic extractive LM. Compare composite metrics; then sweep RRF lane weight and scale session noise. Preserve the two scope boundaries: accuracy is bounded by the deterministic extractive LM, and the semantic lane is a hashing-embedding surrogate rather than a learned dense retriever."
expected_figures:
  - fig:retriever_comparison
  - fig:rrf_sensitivity
  - fig:compiler_convergence
  - fig:consolidation
  - fig:category_breakdown
  - fig:evidence_funnel
  - fig:noise_scaling
  - fig:mmr_tradeoff
  - fig:method_ablation
  - fig:orchestration_value
  - fig:scaling_ci
  - fig:backend_comparison
  - fig:paraphrase_retrieval
  - fig:injection_resistance
  - fig:longmemeval
  - fig:bottleneck
expected_tables:
  - tbl:headline_results
baselines:
  - lexical_only
ablations:
  - semantic_only
