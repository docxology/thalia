name: THALIA CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --project . --locked --extra dev
      - name: Verify lockfile
        run: uv lock --project . --check
      - name: Check tracked-file whitespace
        run: git diff --check
      - name: Compile source and scripts
        run: uv run --project . --extra dev python -m compileall -q src scripts
      - name: Run static type check
        run: uv run --project . --extra dev mypy src
      - name: Run lint check
        run: uv run --project . --extra dev ruff check src tests scripts
      - name: Run tests with coverage gate
        run: >-
          PYTHONWARNINGS=error::ResourceWarning
          uv run --project . --extra dev python -m pytest tests/
          --cov=src --cov-report=term-missing
          --cov-report=json:output/reports/coverage.json
          --junitxml=output/reports/pytest.xml --cov-fail-under=90

  packaging:
    name: Packaging and deterministic artifacts
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --project . --locked --extra dev
      - name: Build wheel and verify package layout
        run: |
          uv build
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          unzip -l "$wheel" | grep -q 'src/__init__.py'
          unzip -l "$wheel" | grep -q 'src/harness.py'
          unzip -l "$wheel" | grep -q 'licenses/LICENSE'
          unzip -p "$wheel" '*/METADATA' | grep -Eq '^(License-Expression: MIT|License: MIT)$'
      - name: Install wheel in an isolated environment and import it
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          isolated="$(mktemp -d)"
          uv venv --python 3.13 "$isolated/venv"
          uv pip install --python "$isolated/venv/bin/python" "$GITHUB_WORKSPACE/$wheel"
          cd "$isolated"
          "$isolated/venv/bin/python" -c 'import src; import src.harness; print(src.__file__)'
      - name: Verify deterministic core import without DSPy
        run: >-
          uv run --no-project --isolated
          --with numpy --with matplotlib --with pyyaml --with tomli
          python -c 'import src.compiler.metrics; print("core import ok")'
      - name: Generate and validate deterministic artifacts
        run: |
          PYTHONWARNINGS=error::ResourceWarning uv run --project . --extra dev python scripts/run_harness_eval.py
          PYTHONWARNINGS=error::ResourceWarning uv run --project . --extra dev python scripts/run_compiler.py
          PYTHONWARNINGS=error::ResourceWarning uv run --project . --extra dev python scripts/run_seed_sensitivity.py
          PYTHONWARNINGS=error::ResourceWarning uv run --project . --extra dev python scripts/run_compiler_generalization.py
          uv run --project . --extra dev python scripts/run_pipeline.py
          uv run --project . --extra dev python scripts/generate_figures.py
          uv run --project . --extra dev python scripts/z_generate_manuscript_variables.py
          uv run --project . --extra dev python scripts/run_demo.py
          uv run --project . --extra dev python scripts/build_dashboard.py
          uv run --project . --extra dev python scripts/validate_artifacts.py
