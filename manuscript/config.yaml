# THALIA Manuscript Configuration
# Agentic Typed-pipeline with Lexical And Structured stages.
# Consumed by infrastructure/rendering (PDF metadata) and project scripts such as
# scripts/z_generate_manuscript_variables.py.

paper:
  title: "THALIA: A Typed Agentic Harness for Reproducible Long-Context Memory Experiments"
  subtitle: "Typed Pipelines, Lexical-Anchored Retrieval, Episodic-First Memory, and Bounded Compiler Traces"
  version: "0.1"
  date: ""  # Auto-generated at render time if empty

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliations:
      - "Active Inference Institute"
      - "FractAI"
    corresponding: true

publication:
  doi: ""  # Assigned on deposit
  doi_status: "forthcoming"
  journal: ""
  year: "2026"

keywords:
  - "DSPy"
  - "declarative pipelines"
  - "recursive language models"
  - "agentic search"
  - "lexical retrieval"
  - "reciprocal rank fusion"
  - "episodic memory"
  - "memory consolidation"
  - "compiler optimization"
  - "GEPA"
  - "active inference"
  - "reproducible research"
  - "OpenRouter"
  - "tencent/hy3-preview"

metadata:
  license: "MIT"
  language: "en"
  # Request the template's LuaLaTeX PDF/UA-2 path; the release gate verifies
  # the resulting structure instead of assuming the declaration succeeded.
  tagged_pdf: true
  # Keep the renderer-level declaration aligned with manuscript/preamble.md.
  # The final PDF geometry is inspected after every publication render.
  geometry: "top=0.42in,bottom=0.45in,left=0.38in,right=0.38in,includeheadfoot"

render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: false
    epub: false

# LLM overlays are disabled by default: this project's core is deterministic and
# offline. A real LM can be wired into the Reasoner and an Ollama review enabled
# here for an optional manuscript review pass.
llm:
  reviews:
    enabled: false
  translations:
    enabled: false

testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Project-specific provenance accepted by the template config schema. Runtime
# harness configuration remains canonical in ../config/harness.yaml, which
# leaves lexical_weight/semantic_weight null (per-task-category defaults from
# src/stages/retriever.py::_CATEGORY_WEIGHTS, ranging (0.75,0.25) to
# (0.55,0.45) across the 6 categories). The pair below is illustrative only:
# it is src/retrieval/fusion.py's DEFAULT_LEXICAL_WEIGHT/DEFAULT_SEMANTIC_WEIGHT
# module-level fallback (also the MULTI_SESSION category's value), used when no
# category-specific override applies — not a claim that 0.65/0.35 is the single
# active runtime setting.
project_config:
  harness:
    num_stages: 5
    max_windows: 15
    top_k: 8
    rrf_k: 60
    lexical_weight: 0.65
    semantic_weight: 0.35
    context_budget_tokens: 2048
    max_evidence: 5
